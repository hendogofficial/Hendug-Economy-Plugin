      - name: Build the plugin
        run: mvn -B package
      - name: Check the jar is real (not empty)
        run: |
          ls -l target/HendogEconomy.jar
          unzip -l target/HendogEconomy.jar | tail -45
          SIZE=$(stat -c%s target/HendogEconomy.jar)
          echo "Jar size: $SIZE bytes"
          if [ "$SIZE" -lt 20000 ]; then echo "ERROR: the jar is too small, something is missing"; exit 1; fi
          unzip -l target/HendogEconomy.jar | grep -q "plugin.yml"
          unzip -l target/HendogEconomy.jar | grep -q "shop.yml"
          unzip -l target/HendogEconomy.jar | grep -q "moderation.yml"
          unzip -l target/HendogEconomy.jar | grep -q "ShopService.class"
          unzip -l target/HendogEconomy.jar | grep -q "ChatFilter.class"
          unzip -l target/HendogEconomy.jar | grep -q "HendogEconomyPlugin.class"
      - uses: actions/upload-artifact@v4
        with:
          name: HendogEconomy
          path: target/HendogEconomy.jar
      - name: Publish the jar as a direct download (see Releases)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" target/HendogEconomy.jar --title "HendogEconomy build ${{ github.run_number }}" --notes "Download HendogEconomy.jar and put it in your server's plugins folder, then restart the server." --latest
